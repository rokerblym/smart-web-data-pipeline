services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: webdatadb
    ports:
      - "5434:5432"
    volumes:
      - webdata_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d webdatadb"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://appuser:apppassword@db:5432/webdatadb
      USER_AGENT: SmartWebDataPipeline/1.0 (+portfolio project)
      RESPECT_ROBOTS_TXT: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  webdata_db_data:
